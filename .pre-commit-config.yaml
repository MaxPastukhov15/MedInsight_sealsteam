repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.3
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic==2.7.4
          - fastapi==0.110.0
          - pytest==8.2.0
          - sqlalchemy[mypy]==2.0.29
          - types-redis
          - httpx==0.27.0
