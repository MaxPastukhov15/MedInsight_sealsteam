repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        language_version: python3.11
        additional_dependencies:
          - pydantic==2.7.4
          - fastapi==0.110.0
          - pytest==8.2.0
          - sqlalchemy[mypy]==2.0.29
          - types-redis
          - httpx==0.27.0
