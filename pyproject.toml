[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "medical-analytics-agent"
version = "1.0.0"
description = "Medical Analytics AI-Agent for SpbTechRun 2025"
authors = ["sealsteam"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/MaxPastukhov15/preparing"
repository = "https://github.com/MaxPastukhov15/preparing"
keywords = []
classifiers = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
plotly = ">=5.18.0"
langchain-core = ">=0.2.0"
langchain-openai = ">=0.1.0"
langgraph = ">=0.1.0"
duckdb = ">=1.0.0"
pydantic = ">=2.5.0"
pydantic-settings = ">=2.0.0"
python-dotenv = ">=1.0.0"
fastapi = ">=0.100.0"
redis = ">=5.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.5.0"
mypy = ">=1.10.0"
pre-commit = ">=3.5.0"
pytest = ">=8.0.0"

# Ruff configuration
[tool.ruff]
line-length = 120
output-format = "grouped"
src = ["backend", "etl"]
exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
ignore = ["PLR0913"]


[tool.mypy]
python_version = "3.12"
files = ["backend", "etl"]
strict = false
ignore_missing_imports = true
explicit_package_bases = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests", "etl/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
